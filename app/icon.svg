<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- The counting house at night: oak-black ground, gold leaf mark -->
  <rect width="100" height="100" rx="18" fill="#12100C"/>
  <rect x="3.5" y="3.5" width="93" height="93" rx="15" fill="none"
        stroke="#C9A227" stroke-width="3"/>

  <!-- Florin. Drawn as a path so it never depends on a font being present. -->
  <g stroke="#C9A227" stroke-width="9" stroke-linecap="round" fill="none">
    <path d="M70 24
             C60 15, 47 18, 44 34
             L32 74
             C29 87, 21 89, 15 84"/>
    <path d="M26 52 L64 52"/>
  </g>
</svg>
